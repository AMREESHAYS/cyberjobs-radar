name: fetch-and-deploy
on:
  schedule:
    - cron: "0 */5 * * *"   # every 5h (00,05,10,15,20 UTC)
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          NAV_TOKEN: ${{ secrets.NAV_TOKEN }}
          WEB3CAREER_TOKEN: ${{ secrets.WEB3CAREER_TOKEN }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: python -m pipeline.run
      - name: Email digest (no-op without GMAIL secrets)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python -m pipeline.digest
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore: refresh jobs data" || echo "no changes"
          # hourly runs race with local pushes; rebase before pushing
          git pull --rebase --autostash origin master
          git push
      # Cloudflare (Workers static assets): free HTTPS host so the PWA is
      # installable on a phone. Skipped automatically when the token is absent.
      - name: Build site
        run: ./build_site.sh
      # the secrets context is not readable from a step `if`, so gate on env
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy

      # GitHub Pages stays available for a public repo; set ENABLE_PAGES=true.
      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: fetch
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
