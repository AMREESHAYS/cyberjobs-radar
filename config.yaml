countries: ["CH", "DE", "AT", "NL", "BE", "PL", "SE", "NO", "DK", "FI", "REMOTE"]
search_terms:
  - cybersecurity
  - "security engineer"
  - "SOC analyst"
  - "penetration tester"
  - "red team"
  - "application security"
  - "cloud security"
  - DevSecOps
  - "information security"
  - "incident response"
  - "security internship"
  # entry-level wording, so the boards stop answering with senior roles only
  - "junior security"
  - "graduate security"
  - "cyber security intern"
  - "security trainee"
  - "werkstudent security"
  - "praktikum informationssicherheit"
# titles advertising a seniority an entry-level candidate cannot claim. An
# explicit junior/graduate/intern marker in the same title overrides these.
exclude_title_patterns:
  - '\bsenior\b'
  - '\bsr\.?\b'
  - '\blead\b'
  - '\bprincipal\b'
  - '\bstaff\b'
  - '\bhead\b'
  - '\bdirector\b'
  - '\bchief\b'
  - '\b(cto|ciso|vp)\b'
  - '\bmanager\b'
  - '\barchitect\b'
  - '\bexpert\b'
  - '\bleiter(in)?\b'
  - '\bteam ?lead\b'
  - '\b(1[0-9]|[5-9])\+? ?(years|jahre)\b'

# Applicant tracking systems, which publish the full ad rather than a teaser.
# Workable is searched globally; greenhouse and ashby are per-company boards —
# add a token by finding it in the careers-page URL, e.g.
# job-boards.greenhouse.io/<token> or jobs.ashbyhq.com/<token>.
workable_query: security
ats:
  greenhouse: [proton, scandit, ledgy, 21shares, sumup, n26]
  ashby: [deepjudge, frontify, ledger]
  lever: [sonarsource]
  smartrecruiters: [nexthink]
  recruitee: [swisscom, elca]

age_out_days: 45
ai:
  base_url_default: "https://api.groq.com/openai/v1"
  model_default: "openai/gpt-oss-120b"   # Groq retired llama-3.3-70b-versatile on 2026-06-17
max_new_ai_jobs_per_run: 10    # per-run AI budget. Groq's free tier allows 200k
                               # tokens/day and scoring must not spend all of it: the
                               # Worker's "Draft application" button draws on the same
                               # account quota. 10/run over 12 runs is ~120 jobs/day
                               # (~130k tokens), leaving room for ~35 drafts. Raise it
                               # if you move off the free tier.
digest:
  min_score: 70    # email jobs scoring >= this (unscored jobs are included too, so it works without AI)
  cap: 25          # max jobs per email
